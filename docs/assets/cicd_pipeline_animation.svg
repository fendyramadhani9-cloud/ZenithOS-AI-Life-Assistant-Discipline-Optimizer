<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0D14" />
      <stop offset="50%" stop-color="#0F1420" />
      <stop offset="100%" stop-color="#0A0D14" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151C2C" />
      <stop offset="100%" stop-color="#0E131E" />
    </linearGradient>

    <linearGradient id="sky-indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-sky" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      .title { font-family: 'Segoe UI', Inter, -apple-system, sans-serif; font-weight: 700; fill: #FFFFFF; font-size: 16px; letter-spacing: 0.5px; }
      .subtitle { font-family: 'Segoe UI', Inter, -apple-system, sans-serif; font-weight: 400; fill: #94A3B8; font-size: 11px; }
      .tag { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 9px; font-weight: 600; fill: #38BDF8; }
      .tag-green { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 9px; font-weight: 600; fill: #34D399; }
      .tag-amber { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 9px; font-weight: 600; fill: #FBBF24; }
      .header-title { font-family: 'Segoe UI', Inter, -apple-system, sans-serif; font-weight: 800; fill: #FFFFFF; font-size: 20px; letter-spacing: 1px; }
      .header-sub { font-family: 'Segoe UI', Inter, sans-serif; font-size: 12px; fill: #64748B; }

      /* Flow Line Animations */
      .flow-line {
        stroke-dasharray: 8 6;
        animation: flowAnimation 2s linear infinite;
      }
      .flow-line-reverse {
        stroke-dasharray: 8 6;
        animation: flowAnimationReverse 2s linear infinite;
      }

      @keyframes flowAnimation {
        from { stroke-dashoffset: 28; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flowAnimationReverse {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 28; }
      }

      /* Pulse Packets */
      .pulse-dot {
        animation: pulseFade 2s ease-in-out infinite;
      }
      @keyframes pulseFade {
        0%, 100% { opacity: 0.3; r: 3; }
        50% { opacity: 1; r: 5; }
      }

      /* Card Hover/Glow Animation */
      .card-box {
        transition: all 0.3s ease;
      }
      .card-box:hover {
        stroke: #38BDF8;
      }

      .status-pulse {
        animation: statusBlink 1.5s infinite;
      }
      @keyframes statusBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="480" rx="16" fill="url(#bg-gradient)" stroke="#1E2638" stroke-width="1.5" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.1">
    <path d="M 0 60 L 1000 60 M 0 120 L 1000 120 M 0 180 L 1000 180 M 0 240 L 1000 240 M 0 300 L 1000 300 M 0 360 L 1000 360 M 0 420 L 1000 420" stroke="#38BDF8" stroke-width="0.5" />
    <path d="M 100 0 L 100 480 M 200 0 L 200 480 M 300 0 L 300 480 M 400 0 L 400 480 M 500 0 L 500 480 M 600 0 L 600 480 M 700 0 L 700 480 M 800 0 L 800 480 M 900 0 L 900 480" stroke="#38BDF8" stroke-width="0.5" />
  </g>

  <!-- Header Section -->
  <g transform="translate(40, 40)">
    <circle cx="10" cy="10" r="6" fill="#38BDF8" filter="url(#glow-sky)" />
    <circle cx="10" cy="10" r="3" fill="#FFFFFF" />
    <text x="26" y="15" class="header-title">ZENITHOS CI/CD AUTOMATION PIPELINE</text>
    <text x="26" y="32" class="header-sub">Continuous Quality Verification &amp; Delivery Approval Flow</text>
    <rect x="760" y="-4" width="160" height="28" rx="14" fill="#151C2C" stroke="#34D399" stroke-width="1" />
    <circle cx="776" cy="10" r="4" fill="#34D399" class="status-pulse" />
    <text x="788" y="14" class="tag-green">ALL SYSTEMS PASSING</text>
  </g>

  <!-- Connection Lines (Under Cards) -->
  <!-- Trigger -> CI Pipeline -->
  <path d="M 180 230 L 280 230" stroke="#38BDF8" stroke-width="2" class="flow-line" filter="url(#glow-sky)" opacity="0.8" />
  
  <!-- CI Branches -->
  <path d="M 280 230 C 330 230, 330 130, 380 130" stroke="#38BDF8" stroke-width="2" class="flow-line" opacity="0.7" />
  <path d="M 280 230 C 330 230, 330 200, 380 200" stroke="#38BDF8" stroke-width="2" class="flow-line" opacity="0.7" />
  <path d="M 280 230 C 330 230, 330 270, 380 270" stroke="#38BDF8" stroke-width="2" class="flow-line" opacity="0.7" />
  <path d="M 280 230 C 330 230, 330 340, 380 340" stroke="#38BDF8" stroke-width="2" class="flow-line" opacity="0.7" />

  <!-- CI Converge -> Approval Gate -->
  <path d="M 560 130 C 610 130, 610 230, 650 230" stroke="#34D399" stroke-width="2" class="flow-line" opacity="0.7" />
  <path d="M 560 200 C 610 200, 610 230, 650 230" stroke="#34D399" stroke-width="2" class="flow-line" opacity="0.7" />
  <path d="M 560 270 C 610 270, 610 230, 650 230" stroke="#34D399" stroke-width="2" class="flow-line" opacity="0.7" />
  <path d="M 560 340 C 610 340, 610 230, 650 230" stroke="#34D399" stroke-width="2" class="flow-line" opacity="0.7" />

  <!-- Approval Gate -> Deliverables -->
  <path d="M 770 230 C 800 230, 800 170, 830 170" stroke="#818CF8" stroke-width="2" class="flow-line" opacity="0.8" />
  <path d="M 770 230 C 800 230, 800 290, 830 290" stroke="#818CF8" stroke-width="2" class="flow-line" opacity="0.8" />

  <!-- Column 1: TRIGGER -->
  <g transform="translate(40, 160)">
    <rect width="140" height="140" rx="12" fill="url(#card-grad)" stroke="#1E2638" stroke-width="1.5" filter="url(#card-shadow)" class="card-box" />
    <rect x="12" y="14" width="60" height="20" rx="4" fill="#1E2638" />
    <text x="20" y="27" class="tag">TRIGGER</text>
    <text x="14" y="58" class="title">Code Push</text>
    <text x="14" y="74" class="subtitle">&amp; Pull Request</text>
    <path d="M 14 92 L 126 92" stroke="#1E2638" stroke-width="1" />
    <text x="14" y="112" class="tag" fill="#94A3B8">• branch: main</text>
    <text x="14" y="126" class="tag" fill="#94A3B8">• tags: v*.*.*</text>
  </g>

  <!-- Column 2: CI STAGES (4 parallel cards) -->
  <!-- Stage 1: Lint & Analysis -->
  <g transform="translate(380, 100)">
    <rect width="180" height="56" rx="10" fill="url(#card-grad)" stroke="#1E2638" stroke-width="1.5" filter="url(#card-shadow)" class="card-box" />
    <circle cx="20" cy="28" r="5" fill="#34D399" filter="url(#glow-green)" />
    <text x="34" y="24" class="title" font-size="13">Flutter Lint &amp; Analysis</text>
    <text x="34" y="42" class="tag-green">dart format + analyze [0 errors]</text>
  </g>

  <!-- Stage 2: Web Build -->
  <g transform="translate(380, 170)">
    <rect width="180" height="56" rx="10" fill="url(#card-grad)" stroke="#1E2638" stroke-width="1.5" filter="url(#card-shadow)" class="card-box" />
    <circle cx="20" cy="28" r="5" fill="#38BDF8" filter="url(#glow-sky)" />
    <text x="34" y="24" class="title" font-size="13">Flutter Web Build</text>
    <text x="34" y="42" class="tag">release JS bundle [SPA / Nginx]</text>
  </g>

  <!-- Stage 3: Android APK -->
  <g transform="translate(380, 240)">
    <rect width="180" height="56" rx="10" fill="url(#card-grad)" stroke="#1E2638" stroke-width="1.5" filter="url(#card-shadow)" class="card-box" />
    <circle cx="20" cy="28" r="5" fill="#34D399" filter="url(#glow-green)" />
    <text x="34" y="24" class="title" font-size="13">Android APK Build</text>
    <text x="34" y="42" class="tag-green">minSdk 24 + desugar [PASS]</text>
  </g>

  <!-- Stage 4: Backend Node 22 -->
  <g transform="translate(380, 310)">
    <rect width="180" height="56" rx="10" fill="url(#card-grad)" stroke="#1E2638" stroke-width="1.5" filter="url(#card-shadow)" class="card-box" />
    <circle cx="20" cy="28" r="5" fill="#818CF8" />
    <text x="34" y="24" class="title" font-size="13">Node.js 22 LTS Backend</text>
    <text x="34" y="42" class="tag" fill="#818CF8">Baileys WA + Cron [Verified]</text>
  </g>

  <!-- Column 3: APPROVAL GATE -->
  <g transform="translate(650, 175)">
    <rect width="120" height="110" rx="12" fill="url(#card-grad)" stroke="#FBBF24" stroke-width="1.5" filter="url(#card-shadow)" class="card-box" />
    <rect x="12" y="12" width="96" height="18" rx="4" fill="#29200D" />
    <text x="18" y="25" class="tag-amber">APPROVAL GATE</text>
    <text x="14" y="54" class="title" font-size="12">Production</text>
    <text x="14" y="70" class="subtitle">Platform Eng</text>
    <text x="14" y="84" class="subtitle">Review Required</text>
    <circle cx="105" cy="95" r="4" fill="#FBBF24" class="status-pulse" />
  </g>

  <!-- Column 4: ARTIFACT DELIVERY -->
  <!-- Web Tarball -->
  <g transform="translate(830, 140)">
    <rect width="130" height="60" rx="10" fill="url(#card-grad)" stroke="#38BDF8" stroke-width="1.2" filter="url(#card-shadow)" class="card-box" />
    <text x="12" y="24" class="title" font-size="12">Web Bundle</text>
    <text x="12" y="40" class="subtitle">zenith-web.tar.gz</text>
    <text x="12" y="52" class="tag">Nginx Docker Ready</text>
  </g>

  <!-- Android APK -->
  <g transform="translate(830, 260)">
    <rect width="130" height="60" rx="10" fill="url(#card-grad)" stroke="#34D399" stroke-width="1.2" filter="url(#card-shadow)" class="card-box" />
    <text x="12" y="24" class="title" font-size="12">Native Android</text>
    <text x="12" y="40" class="subtitle">zenith-os.apk</text>
    <text x="12" y="52" class="tag-green">Direct Install APK</text>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(40, 420)">
    <rect width="920" height="36" rx="8" fill="#121722" stroke="#1E2638" stroke-width="1" />
    <text x="20" y="23" class="tag" fill="#94A3B8">INFRASTRUCTURE STATUS: </text>
    <text x="160" y="23" class="tag-green">100% GREEN (DETERMINISTIC)</text>
    <text x="400" y="23" class="tag" fill="#94A3B8">BUILD TIME: </text>
    <text x="480" y="23" class="tag">~3m 45s</text>
    <text x="600" y="23" class="tag" fill="#94A3B8">PLATFORM: </text>
    <text x="670" y="23" class="tag">FLUTTER 3.27 LTS / NODE 22</text>
    <text x="850" y="23" class="tag-green">BYOK VAULT</text>
  </g>
</svg>
