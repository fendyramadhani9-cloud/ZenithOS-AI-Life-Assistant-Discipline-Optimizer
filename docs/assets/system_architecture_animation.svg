<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="sys-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0D14" />
      <stop offset="50%" stop-color="#0D121D" />
      <stop offset="100%" stop-color="#0A0D14" />
    </linearGradient>

    <linearGradient id="sys-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151C2C" />
      <stop offset="100%" stop-color="#0F1522" />
    </linearGradient>

    <linearGradient id="sys-accent-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="sys-accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="sys-accent-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Filters -->
    <filter id="sys-glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="sys-glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="sys-glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .sys-header { font-family: 'Segoe UI', Inter, sans-serif; font-weight: 800; fill: #FFFFFF; font-size: 20px; letter-spacing: 1px; }
      .sys-sub { font-family: 'Segoe UI', Inter, sans-serif; font-size: 12px; fill: #64748B; }
      .sys-title { font-family: 'Segoe UI', Inter, sans-serif; font-weight: 700; fill: #F8FAFC; font-size: 14px; }
      .sys-desc { font-family: 'Segoe UI', Inter, sans-serif; font-size: 10.5px; fill: #94A3B8; }
      .sys-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 9px; font-weight: 600; }

      /* Flow Line Animations */
      .circuit-flow {
        stroke-dasharray: 6 6;
        animation: circuitMove 1.8s linear infinite;
      }
      .circuit-flow-fast {
        stroke-dasharray: 4 4;
        animation: circuitMove 1.2s linear infinite;
      }
      .circuit-flow-rev {
        stroke-dasharray: 6 6;
        animation: circuitMoveRev 1.8s linear infinite;
      }

      @keyframes circuitMove {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes circuitMoveRev {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }

      .pulse-beacon {
        animation: beaconPulse 2s ease-in-out infinite;
      }
      @keyframes beaconPulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.3); opacity: 0.3; }
      }

      .status-dot {
        animation: blink 1.6s infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" rx="16" fill="url(#sys-bg)" stroke="#1E2638" stroke-width="1.5" />

  <!-- Circuit Background Grid -->
  <g opacity="0.08">
    <path d="M 50 0 L 50 520 M 150 0 L 150 520 M 250 0 L 250 520 M 350 0 L 350 520 M 450 0 L 450 520 M 550 0 L 550 520 M 650 0 L 650 520 M 750 0 L 750 520 M 850 0 L 850 520 M 950 0 L 950 520" stroke="#818CF8" stroke-width="0.5" />
    <path d="M 0 50 L 1000 50 M 0 150 L 1000 150 M 0 250 L 1000 250 M 0 350 L 1000 350 M 0 450 L 1000 450" stroke="#818CF8" stroke-width="0.5" />
  </g>

  <!-- Header Section -->
  <g transform="translate(40, 38)">
    <circle cx="10" cy="10" r="6" fill="#818CF8" filter="url(#sys-glow-purple)" />
    <circle cx="10" cy="10" r="3" fill="#FFFFFF" />
    <text x="26" y="15" class="sys-header">ZENITHOS RESILIENT SYSTEM ARCHITECTURE</text>
    <text x="26" y="32" class="sys-sub">Enterprise Clean Architecture • Offline-First Persistence • AI Failover Pool</text>
    <rect x="740" y="-4" width="180" height="28" rx="14" fill="#151C2C" stroke="#38BDF8" stroke-width="1" />
    <circle cx="756" cy="10" r="4" fill="#38BDF8" class="status-dot" />
    <text x="768" y="14" class="sys-mono" fill="#38BDF8">REAL-TIME DATA BUS: ACTIVE</text>
  </g>

  <!-- Connecting Bus Lines (Back Layer) -->
  <!-- Layer 1 (Presentation) to Layer 2 (Core Engine) -->
  <path d="M 230 180 L 380 180" stroke="#38BDF8" stroke-width="2" class="circuit-flow" filter="url(#sys-glow-blue)" opacity="0.8" />
  <path d="M 230 360 L 380 360" stroke="#38BDF8" stroke-width="2" class="circuit-flow" filter="url(#sys-glow-blue)" opacity="0.8" />
  <path d="M 380 180 L 380 360" stroke="#38BDF8" stroke-width="2" opacity="0.5" />

  <!-- Layer 2 (Core Engine) to Layer 3 (AI Cloud & Automation) -->
  <path d="M 620 200 L 760 160" stroke="#818CF8" stroke-width="2" class="circuit-flow-fast" filter="url(#sys-glow-purple)" opacity="0.9" />
  <path d="M 620 340 L 760 380" stroke="#34D399" stroke-width="2" class="circuit-flow-fast" filter="url(#sys-glow-green)" opacity="0.9" />

  <!-- SECTION 1: PRESENTATION CLIENTS (Left) -->
  <g transform="translate(40, 100)">
    <!-- Desktop / Web Card -->
    <rect width="190" height="140" rx="12" fill="url(#sys-card)" stroke="#1E2638" stroke-width="1.5" />
    <rect x="12" y="12" width="80" height="20" rx="4" fill="#1E2638" />
    <text x="20" y="25" class="sys-mono" fill="#38BDF8">CLIENT: WEB</text>
    <text x="14" y="56" class="sys-title">Flutter Web (Nginx)</text>
    <text x="14" y="74" class="sys-desc">• Multi-Column Dashboard</text>
    <text x="14" y="90" class="sys-desc">• Webhook Alarm Dispatch</text>
    <text x="14" y="106" class="sys-desc">• Homelab &amp; Docker Ready</text>
    <text x="14" y="126" class="sys-mono" fill="#38BDF8">PORT: 8080 (SPA)</text>
  </g>

  <g transform="translate(40, 280)">
    <!-- Android Native Card -->
    <rect width="190" height="150" rx="12" fill="url(#sys-card)" stroke="#1E2638" stroke-width="1.5" />
    <rect x="12" y="12" width="100" height="20" rx="4" fill="#1E2638" />
    <text x="20" y="25" class="sys-mono" fill="#34D399">CLIENT: ANDROID</text>
    <text x="14" y="56" class="sys-title">Native Android APK</text>
    <text x="14" y="74" class="sys-desc">• Exact Alarms (Android 14+)</text>
    <text x="14" y="90" class="sys-desc">• Food Camera Vision</text>
    <text x="14" y="106" class="sys-desc">• Multi-Dex &amp; Desugaring</text>
    <text x="14" y="122" class="sys-desc">• Zero Backend Required</text>
    <text x="14" y="138" class="sys-mono" fill="#34D399">minSdk 24 | v2 Embedding</text>
  </g>

  <!-- SECTION 2: CORE RESILIENCE VAULT (Center Hub) -->
  <g transform="translate(380, 110)">
    <rect width="240" height="310" rx="14" fill="url(#sys-card)" stroke="#38BDF8" stroke-width="1.5" filter="url(#sys-glow-blue)" opacity="0.95" />
    <rect x="14" y="14" width="130" height="22" rx="4" fill="#142838" />
    <text x="22" y="29" class="sys-mono" fill="#38BDF8">CORE VAULT &amp; LOGIC</text>
    
    <!-- Module A: BYOK Key Vault -->
    <rect x="14" y="48" width="212" height="60" rx="8" fill="#101726" stroke="#1E2638" />
    <text x="24" y="68" class="sys-title" font-size="12">BYOK Secure Key Vault</text>
    <text x="24" y="84" class="sys-desc">AES-256 flutter_secure_storage</text>
    <text x="24" y="98" class="sys-mono" fill="#38BDF8">Auto-failover rate limit 429</text>

    <!-- Module B: Offline Hive Queue -->
    <rect x="14" y="118" width="212" height="60" rx="8" fill="#101726" stroke="#1E2638" />
    <text x="24" y="138" class="sys-title" font-size="12">Offline-First Hive Storage</text>
    <text x="24" y="154" class="sys-desc">Local JSON Cache &amp; Queue Sync</text>
    <text x="24" y="168" class="sys-mono" fill="#34D399">Pending flush on reconnect</text>

    <!-- Module C: Nutrition Dictionary -->
    <rect x="14" y="188" width="212" height="60" rx="8" fill="#101726" stroke="#1E2638" />
    <text x="24" y="208" class="sys-title" font-size="12">Emergency Food Dictionary</text>
    <text x="24" y="224" class="sys-desc">100+ Offline Macronutrient Profiles</text>
    <text x="24" y="238" class="sys-mono" fill="#818CF8">Zero API dependency fallback</text>

    <!-- Module D: Status Banner -->
    <text x="24" y="276" class="sys-title" font-size="11">Time Capsule Daily Journal</text>
    <text x="24" y="292" class="sys-desc">Dual-Layer: Bullets + Private Story</text>
  </g>

  <!-- SECTION 3: EXTERNAL SERVICES (Right) -->
  <!-- Top Right: AI Cloud Engine -->
  <g transform="translate(760, 100)">
    <rect width="200" height="140" rx="12" fill="url(#sys-card)" stroke="#818CF8" stroke-width="1.5" />
    <rect x="12" y="12" width="110" height="20" rx="4" fill="#1E1E38" />
    <text x="18" y="25" class="sys-mono" fill="#818CF8">AI ENGINE POOL</text>
    <text x="14" y="56" class="sys-title">Multi-Provider AI</text>
    <text x="14" y="74" class="sys-desc">• Google Gemini 1.5 Flash / Pro</text>
    <text x="14" y="90" class="sys-desc">• OpenAI GPT-4o &amp; GPT-4o-mini</text>
    <text x="14" y="106" class="sys-desc">• Multimodal Food Vision</text>
    <text x="14" y="124" class="sys-mono" fill="#818CF8">Direct BYOK Encryption</text>
  </g>

  <!-- Bottom Right: Automation & WhatsApp Bot -->
  <g transform="translate(760, 290)">
    <rect width="200" height="140" rx="12" fill="url(#sys-card)" stroke="#34D399" stroke-width="1.5" />
    <rect x="12" y="12" width="120" height="20" rx="4" fill="#122820" />
    <text x="18" y="25" class="sys-mono" fill="#34D399">AUTOMATION BOT</text>
    <text x="14" y="56" class="sys-title">Node.js 22 &amp; Baileys</text>
    <text x="14" y="74" class="sys-desc">• 22:30 Soft Commit Reminder</text>
    <text x="14" y="90" class="sys-desc">• 23:00 Hard Sleep Cutoff</text>
    <text x="14" y="106" class="sys-desc">• WhatsApp Bot Auto Alert</text>
    <text x="14" y="124" class="sys-mono" fill="#34D399">node-cron @ Express Port 3000</text>
  </g>

  <!-- Footer Metric Bar -->
  <g transform="translate(40, 460)">
    <rect width="920" height="34" rx="8" fill="#121722" stroke="#1E2638" stroke-width="1" />
    <circle cx="20" cy="17" r="4" fill="#34D399" class="status-dot" />
    <text x="32" y="21" class="sys-mono" fill="#F8FAFC">ARCHITECTURE: CLEAN ARCHITECTURE (SOLID) | OFFLINE-FIRST | PLATFORM ENGINEER: FENDY RAMADHANI</text>
  </g>
</svg>
