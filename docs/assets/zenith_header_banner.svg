<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="50%" stop-color="#0F1420" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>

    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <filter id="banner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .banner-logo { font-family: 'Segoe UI', Inter, -apple-system, sans-serif; font-weight: 900; font-size: 38px; fill: url(#text-gradient); letter-spacing: 4px; }
      .banner-tagline { font-family: 'Segoe UI', Inter, sans-serif; font-size: 13px; fill: #94A3B8; letter-spacing: 1.5px; font-weight: 500; }
      .banner-metric { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; font-weight: 600; }
      
      /* Neon Pulse Wave */
      .telemetry-wave {
        stroke-dasharray: 6 8;
        animation: waveTravel 2.5s linear infinite;
      }
      @keyframes waveTravel {
        from { stroke-dashoffset: 56; }
        to { stroke-dashoffset: 0; }
      }

      .pulse-ring {
        animation: ringPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes ringPulse {
        0%, 100% { opacity: 0.2; r: 12; }
        50% { opacity: 0.8; r: 18; }
      }

      .live-dot {
        animation: liveBlink 1.4s infinite;
      }
      @keyframes liveBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="240" rx="16" fill="url(#banner-bg)" stroke="#1E2638" stroke-width="1.5" />

  <!-- Animated Telemetry Wave (Sound/Discipline Sine Curve) -->
  <path d="M 0 180 Q 120 140, 250 180 T 500 180 T 750 180 T 1000 180" fill="none" stroke="#38BDF8" stroke-width="2" class="telemetry-wave" opacity="0.4" filter="url(#banner-glow)" />
  <path d="M 0 180 Q 120 210, 250 180 T 500 180 T 750 180 T 1000 180" fill="none" stroke="#818CF8" stroke-width="1.5" class="telemetry-wave" opacity="0.3" />

  <!-- Center Logo & Title -->
  <g transform="translate(500, 75)" text-anchor="middle">
    <!-- Glowing Beacon Icon -->
    <circle cx="0" cy="-25" r="14" fill="#38BDF8" opacity="0.15" class="pulse-ring" />
    <circle cx="0" cy="-25" r="7" fill="#38BDF8" filter="url(#banner-glow)" />
    <circle cx="0" cy="-25" r="3.5" fill="#FFFFFF" />

    <text x="0" y="24" class="banner-logo" filter="url(#banner-glow)">ZENITHOS</text>
    <text x="0" y="46" class="banner-tagline">AI LIFE ASSISTANT • DISCIPLINE OPTIMIZER • KNOWLEDGE VAULT</text>
  </g>

  <!-- Top Real-Time Status Indicators -->
  <!-- Status 1: System Live -->
  <g transform="translate(40, 30)">
    <rect width="170" height="28" rx="14" fill="#121722" stroke="#1E2638" />
    <circle cx="16" cy="14" r="4" fill="#34D399" class="live-dot" />
    <text x="28" y="18" class="banner-metric" fill="#34D399">SYSTEM STATUS: OPTIMAL</text>
  </g>

  <!-- Status 2: Sleep Cutoff Protocol -->
  <g transform="translate(770, 30)">
    <rect width="190" height="28" rx="14" fill="#121722" stroke="#1E2638" />
    <circle cx="16" cy="14" r="4" fill="#F87171" />
    <text x="28" y="18" class="banner-metric" fill="#F87171">SLEEP CUTOFF: 23:00 HARD</text>
  </g>

  <!-- Bottom Metric Pills -->
  <g transform="translate(100, 195)">
    <rect x="0" y="0" width="180" height="26" rx="6" fill="#151C2C" stroke="#38BDF8" stroke-width="0.8" />
    <text x="90" y="17" text-anchor="middle" class="banner-metric" fill="#38BDF8">BYOK AI (GEMINI + GPT-4o)</text>

    <rect x="200" y="0" width="180" height="26" rx="6" fill="#151C2C" stroke="#34D399" stroke-width="0.8" />
    <text x="290" y="17" text-anchor="middle" class="banner-metric" fill="#34D399">OFFLINE-FIRST RESILIENCE</text>

    <rect x="400" y="0" width="180" height="26" rx="6" fill="#151C2C" stroke="#818CF8" stroke-width="0.8" />
    <text x="490" y="17" text-anchor="middle" class="banner-metric" fill="#818CF8">FOOD VISION MULTIMODAL</text>

    <rect x="600" y="0" width="180" height="26" rx="6" fill="#151C2C" stroke="#FBBF24" stroke-width="0.8" />
    <text x="690" y="17" text-anchor="middle" class="banner-metric" fill="#FBBF24">AUTOMATED CI/CD PIPELINE</text>
  </g>
</svg>
