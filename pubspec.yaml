name: zenith_os
description: "ZenithOS - Enterprise AI Life Assistant & Discipline Optimizer for Flutter Web & Mobile"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Design & Icons (Strict Zero-Emoji Policy)
  lucide_icons: ^0.257.0
  google_fonts: ^6.1.0
  fl_chart: ^0.66.2

  # Multi-Provider AI (BYOK & Failover Pool)
  google_generative_ai: ^0.4.6
  dart_openai: ^5.1.0
  http: ^1.2.1

  # Local Storage, Security & Resilience (Offline-First)
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.3

  # Device Integrations
  alarm: ^3.1.4
  device_calendar: ^4.3.2
  file_picker: ^8.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
